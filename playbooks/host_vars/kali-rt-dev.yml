---
# Tuoni host configuration for kali-rt-dev
# Secrets come from .env via playbook env lookup — no vault needed.

tuoni_install_dir: /srv/tuoni
tuoni_api_port: 8443
tuoni_client_port: 12702

tuoni_plugins_enabled: true
tuoni_plugins_branch: "refactor/overhaul-v2"

tuoni_listener_enabled: true
tuoni_listener_port: 443
tuoni_listener_name: "bootstrap-https"

tuoni_self_agent_enabled: false
