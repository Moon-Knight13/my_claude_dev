---
# Tuoni server configuration
# Override per-host in inventory or group_vars as needed.

tuoni_version: "latest"
tuoni_jar_name: "TuoniServerApplication.jar"
tuoni_install_dir: "/app"
tuoni_heap_size: "2G"
tuoni_user: "root"
tuoni_group: "root"

# Java
java_package: "openjdk-25-jre-headless"

# SSH
ssh_authorized_keys_file: ""  # Set in inventory — path to public key file
