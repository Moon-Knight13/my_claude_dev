---
- name: Install offensive tools (apt)
  ansible.builtin.apt:
    name: "{{ offensive_apt_packages }}"
    state: present

- name: Ensure pipx is installed
  ansible.builtin.apt:
    name: pipx
    state: present

- name: Install offensive tools (pipx)
  ansible.builtin.command: "pipx install {{ item }}"
  loop: "{{ offensive_pip_packages }}"
  register: pipx_result
  changed_when: "'installed package' in pipx_result.stdout"
  failed_when:
    - pipx_result.rc != 0
    - "'already seems to be installed' not in pipx_result.stderr"
