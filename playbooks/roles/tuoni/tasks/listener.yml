---
- name: Check existing listeners
  ansible.builtin.uri:
    url: "https://localhost:{{ tuoni_api_port }}/api/v1/listeners"
    method: GET
    user: "{{ tuoni_admin_username }}"
    password: "{{ tuoni_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: tuoni_listeners
  no_log: true

- name: Set listener presence fact
  ansible.builtin.set_fact:
    has_listener: "{{ (tuoni_listeners.json | length) > 0 }}"

- name: Create HTTPS listener
  ansible.builtin.uri:
    url: "https://localhost:{{ tuoni_api_port }}/api/v1/listeners"
    method: POST
    user: "{{ tuoni_admin_username }}"
    password: "{{ tuoni_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ tuoni_listener_name }}"
      plugin: "shelldot.listener.agent-reverse-http"
      configuration:
        port: "{{ tuoni_listener_port }}"
        https: true
    status_code: [200, 201]
  no_log: true
  when: not has_listener
