---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
      - git
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
