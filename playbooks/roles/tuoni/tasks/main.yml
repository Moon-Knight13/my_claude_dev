---
- name: Validate vault secrets are defined
  ansible.builtin.assert:
    that:
      - tuoni_admin_username is defined
      - tuoni_admin_username | length > 0
      - tuoni_admin_password is defined
      - tuoni_admin_password | length > 0
    fail_msg: >
      tuoni_admin_username and tuoni_admin_password must be set in .env
      (TUONI_USERNAME, TUONI_PASSWORD). Playbook reads .env directly.

- name: Install Docker and prerequisites
  ansible.builtin.include_tasks: prerequisites.yml

- name: Install Tuoni (Docker Compose)
  ansible.builtin.include_tasks: install.yml

- name: Deploy Tuoni configuration
  ansible.builtin.include_tasks: config.yml

- name: Deploy TSE plugins and scripts
  ansible.builtin.include_tasks: plugins.yml
  when: tuoni_plugins_enabled

- name: Start Tuoni and verify API
  ansible.builtin.include_tasks: service.yml

- name: Activate commercial licence if key present
  ansible.builtin.include_tasks: licence.yml
  when: tuoni_licence_key | default('') | length > 0

- name: Configure HTTPS listener
  ansible.builtin.include_tasks: listener.yml
  when: tuoni_listener_enabled

- name: Deploy self-agent on Kali
  ansible.builtin.include_tasks: self-agent.yml
  when: tuoni_self_agent_enabled
