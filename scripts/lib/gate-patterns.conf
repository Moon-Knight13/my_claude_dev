# gate-patterns.conf — the public gate patterns (AD-4, conventions "Patterns").
# One file, shared by the gate, the shims, and CI. Parsed, never sourced.
# Nothing here is sensitive: it is the shape of a ref and the fixed text a
# blocked caller sees, so tests and CI can recognise both.

# A block's reference: 128 random bits, never derived from content, time, or a counter.
GATE_REF_PREFIX=gr-
GATE_REF_REGEX=^gr-[0-9a-f]{32}$

# The only text shown inside Claude for a block (the shims print it; <ref> is
# replaced by the block's ref). The reason is never shown there.
GATE_BLOCK_TEXT=blocked by gate · ref <ref> · see hub notification
