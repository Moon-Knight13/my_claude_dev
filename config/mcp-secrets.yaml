# mcp-secrets.yaml — declarative secret-to-MCP scoping.
#
# Committed to repo. No secret VALUES here — only variable NAMES.
# Values live in .env (gitignored, per-install).
#
# mcp-wrapper.sh reads this file at startup and unsets any secret
# variable not in the MCP's allow list. Unknown MCPs get zero secrets
# (fail-closed). Add new MCPs or secrets here — not in shell code.

# All secret variable names the system uses.
# Any var listed here gets unset for MCPs that don't declare it.
secrets:
  - TUONI_USERNAME
  - TUONI_PASSWORD
  - PROVIDENTIA_TOKEN
  - GITLAB_TOKEN
  - GITLAB_PROJECT
  - OUTLINE_API_KEY
  - OUTLINE_TOKEN
  - BLOODHOUND_USERNAME
  - BLOODHOUND_PASSWORD

# Per-MCP allow list. Only listed vars survive into exec.
# Missing from this map = zero secrets.
scoping:
  tuoni-mcp:
    - TUONI_USERNAME
    - TUONI_PASSWORD
  range-intel:
    - PROVIDENTIA_TOKEN
    - GITLAB_TOKEN
    - GITLAB_PROJECT
  outline-readonly:
    - OUTLINE_API_KEY
    - OUTLINE_TOKEN
  bloodhound-mcp:
    - BLOODHOUND_USERNAME
    - BLOODHOUND_PASSWORD
  # Reference MCPs — internet-facing, third-party packages. Zero secrets.
  hacktricks-mcp: []
  mitre-mcp: []
  lolbins-mcp: []
  cve-mcp: []
  # Local-only MCPs. Zero range secrets.
  obsidian-mcp: []
  rea-mcp: []
  local-ollama: []
  ghidra-mcp: []
