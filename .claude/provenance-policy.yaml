# Provenance-based tool-call verification policy.
#
# Tools listed here require verified provenance before execution.
# Provenance = session identity + mode + origin, checked against
# requirements per tool class.
#
# Classes:
#   critical   — destructive or credential-bearing; require registered
#                session + correct mode + operator origin (not rogue delegate)
#   sensitive  — operational tools; require registered session + correct mode
#   monitored  — logged with full provenance but not gated beyond mode check

# Session registration directory. Each active session writes a file here
# at startup; the hook checks for its existence.
session_dir: ".claude/sessions"

# Maximum session age in seconds before provenance is stale (24h).
max_session_age: 86400

# --- Tool classifications ---------------------------------------------------

critical:
  # tuoni command execution — prepare + execute are the actual execution path
  - "mcp__tuoni-mcp__tuoni_command_prepare"
  - "mcp__tuoni-mcp__tuoni_command_stop_prepare"
  - "mcp__tuoni-mcp__tuoni_command_update_prepare"
  - "mcp__tuoni-mcp__tuoni_operation_execute"
  # tuoni agent control — block/restore/clear_queue mutate agent state
  - "mcp__tuoni-mcp__tuoni_agent_block"
  - "mcp__tuoni-mcp__tuoni_agent_restore"
  - "mcp__tuoni-mcp__tuoni_agent_clear_queue"
  - "mcp__tuoni-mcp__tuoni_agent_set_inactive"
  - "mcp__tuoni-mcp__tuoni_agent_set_custom_property"
  # tuoni listener lifecycle — create/delete/start/stop/update mutate
  - "mcp__tuoni-mcp__tuoni_listener_create"
  - "mcp__tuoni-mcp__tuoni_listener_delete"
  - "mcp__tuoni-mcp__tuoni_listener_start"
  - "mcp__tuoni-mcp__tuoni_listener_stop"
  - "mcp__tuoni-mcp__tuoni_listener_update"
  # tuoni payload mutation
  - "mcp__tuoni-mcp__tuoni_payload_create"
  - "mcp__tuoni-mcp__tuoni_payload_delete"
  - "mcp__tuoni-mcp__tuoni_payload_rename"
  # tuoni host/service/alias/credential/job mutation
  - "mcp__tuoni-mcp__tuoni_host_add"
  - "mcp__tuoni-mcp__tuoni_host_archive"
  - "mcp__tuoni-mcp__tuoni_host_update"
  - "mcp__tuoni-mcp__tuoni_service_add"
  - "mcp__tuoni-mcp__tuoni_service_archive"
  - "mcp__tuoni-mcp__tuoni_service_update"
  - "mcp__tuoni-mcp__tuoni_alias_create"
  - "mcp__tuoni-mcp__tuoni_alias_delete"
  - "mcp__tuoni-mcp__tuoni_alias_update"
  - "mcp__tuoni-mcp__tuoni_alias_download_file"
  - "mcp__tuoni-mcp__tuoni_credential_add"
  - "mcp__tuoni-mcp__tuoni_credential_archive"
  - "mcp__tuoni-mcp__tuoni_credential_update"
  - "mcp__tuoni-mcp__tuoni_job_pause"
  - "mcp__tuoni-mcp__tuoni_job_restart"
  - "mcp__tuoni-mcp__tuoni_job_resume"
  # tuoni user/settings mutation
  - "mcp__tuoni-mcp__tuoni_user_create"
  - "mcp__tuoni-mcp__tuoni_user_set_*"
  - "mcp__tuoni-mcp__tuoni_setting_update"
  - "mcp__tuoni-mcp__tuoni_settings_update_bulk"
  # destructive Bash patterns are caught separately by the hook

sensitive:
  # tuoni read-only inspection (commands, agents, listeners, payloads, plugins)
  - "mcp__tuoni-mcp__tuoni_command_describe"
  - "mcp__tuoni-mcp__tuoni_command_get"
  - "mcp__tuoni-mcp__tuoni_command_plugin_command_get"
  - "mcp__tuoni-mcp__tuoni_command_plugin_commands_list"
  - "mcp__tuoni-mcp__tuoni_command_plugins_list"
  - "mcp__tuoni-mcp__tuoni_commands_list"
  - "mcp__tuoni-mcp__tuoni_commands_search"
  - "mcp__tuoni-mcp__tuoni_agent_get"
  - "mcp__tuoni-mcp__tuoni_agents_list"
  - "mcp__tuoni-mcp__tuoni_listener_get"
  - "mcp__tuoni-mcp__tuoni_listener_plugin_get"
  - "mcp__tuoni-mcp__tuoni_listener_plugins_list"
  - "mcp__tuoni-mcp__tuoni_listeners_list"
  - "mcp__tuoni-mcp__tuoni_payload_get"
  - "mcp__tuoni-mcp__tuoni_payload_download"
  - "mcp__tuoni-mcp__tuoni_payload_template_get"
  - "mcp__tuoni-mcp__tuoni_payload_plugin_templates_list"
  - "mcp__tuoni-mcp__tuoni_payload_plugins_list"
  - "mcp__tuoni-mcp__tuoni_payloads_list"
  - "mcp__tuoni-mcp__tuoni_users_list"
  - "mcp__tuoni-mcp__tuoni_setting_get"
  - "mcp__tuoni-mcp__tuoni_settings_get_all"
  # tuoni discovery read
  - "mcp__tuoni-mcp__tuoni_discovery_*"
  # tuoni credential/host/service/alias/job read-only
  - "mcp__tuoni-mcp__tuoni_credentials_list"
  - "mcp__tuoni-mcp__tuoni_hosts_list"
  - "mcp__tuoni-mcp__tuoni_services_list"
  - "mcp__tuoni-mcp__tuoni_aliases_list"
  - "mcp__tuoni-mcp__tuoni_alias_get"
  - "mcp__tuoni-mcp__tuoni_jobs_list"
  - "mcp__tuoni-mcp__tuoni_job_get"
  # range intel queries
  - "mcp__range-intel__*"
  - "mcp__range_intel__*"
  # obsidian writes
  - "mcp__obsidian-mcp__create_*"
  - "mcp__obsidian-mcp__update_*"
  - "mcp__obsidian-mcp__delete_*"
  # outline wiki writes
  - "mcp__outline-write__*"

monitored:
  # research MCPs — log provenance for audit, no gate
  - "mcp__hacktricks-mcp__*"
  - "mcp__mitre-mcp__*"
  - "mcp__mitre-attack-mcp__*"
  - "mcp__gtfobins-mcp__*"
  - "mcp__eip-mcp__*"
  - "mcp__rea-mcp__*"
  - "mcp__ghidra-mcp__*"

# Modes allowed for critical tools. Others are denied even with valid session.
critical_modes:
  - "red-team"
  - "purple"
  - "red-dev"
  - "pentest"
  - "ctf"
  - "bounty"

# Modes allowed for sensitive tools.
sensitive_modes:
  - "red-team"
  - "purple"
  - "red-dev"
  - "pentest"
  - "ctf"
  - "bounty"
  - "green-dev"
  - "platform-ops"

# Destructive Bash detection is handled by the ctp guard stack (pretooluse-ctp.sh)
# and tuoni-secret-guard.sh. Provenance focuses on MCP tool identity verification.
# If Bash-level provenance is needed later, add patterns here — but note that
# regex on the full command string will false-positive on strings inside arguments
# (e.g. python -c 'code mentioning rm'). Use guard-stack.sh for Bash gating.
